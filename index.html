<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .row-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0 10px;
            color: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Row 1: Rocket League -->
        <div class="row-title">Rocket League</div>
        <div class="grid">
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw4ePe5vFuEhGcKTZSGTUcjA2X2Nkpfpji844jKZLIOAjL7_2J85SyRdy6&s=10" alt="Rocket League 1">
                <div class="card-content">
                    <h3>Rocket League 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/rocket_league_2.jpg" alt="Rocket League 2">
                <div class="card-content">
                    <h3>Rocket League 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/rocket_league_3.jpg" alt="Rocket League 3">
                <div class="card-content">
                    <h3>Rocket League 3</h3>
                </div>
            </div>
        </div>

        <!-- Row 2: Fortnite -->
        <div class="row-title">Fortnite</div>
        <div class="grid">
            <div class="card">
                <img src="images/fortnite_1.jpg" alt="Fortnite 1">
                <div class="card-content">
                    <h3>Fortnite 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/fortnite_2.jpg" alt="Fortnite 2">
                <div class="card-content">
                    <h3>Fortnite 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/fortnite_3.jpg" alt="Fortnite 3">
                <div class="card-content">
                    <h3>Fortnite 3</h3>
                </div>
            </div>
        </div>

        <!-- Row 3: Minecraft -->
        <div class="row-title">Minecraft</div>
        <div class="grid">
            <div class="card">
                <img src="images/minecraft_1.jpg" alt="Minecraft 1">
                <div class="card-content">
                    <h3>Minecraft 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/minecraft_2.jpg" alt="Minecraft 2">
                <div class="card-content">
                    <h3>Minecraft 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="images/minecraft_3.jpg" alt="Minecraft 3">
                <div class="card-content">
                    <h3>Minecraft 3</h3>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
