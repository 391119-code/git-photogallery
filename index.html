<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .row-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0 10px;
            color: #333;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Row 1: Rocket League -->
        <div class="row-title">Rocket League</div>
        <div class="grid">
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQw4ePe5vFuEhGcKTZSGTUcjA2X2Nkpfpji844jKZLIOAjL7_2J85SyRdy6&s=10" alt="Rocket League 1">
                <div class="card-content">
                    <h3>Rocket League 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://img.redbull.com/images/c_limit,w_1500,h_1000/f_auto,q_auto/redbullcom/2017/08/25/f8052807-f589-4fb5-84d4-b918b03da7fc/rocket-league-octane" alt="Rocket League 2">
                <div class="card-content">
                    <h3>Rocket League 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://static.wikia.nocookie.net/ultimatepopculture/images/e/e8/Rocket_League.jpg" alt="Rocket League 3">
                <div class="card-content">
                    <h3>Rocket League 3</h3>
                </div>
            </div>
        </div>

        <!-- Row 2: Fortnite -->
        <div class="row-title">Fortnite</div>
        <div class="grid">
            <div class="card">
                <img src="https://m.media-amazon.com/images/M/MV5BMGEzMDcyODAtNzY0Yy00N2E5LTllYzgtODMyNzNiOWI2MjJjXkEyXkFqcGc@._V1_.jpg" alt="Fortnite 1">
                <div class="card-content">
                    <h3>Fortnite 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://mediaproxy.tvtropes.org/width/1200/https://static.tvtropes.org/pmwiki/pub/images/img_3658_2.jpeg" alt="Fortnite 2">
                <div class="card-content">
                    <h3>Fortnite 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://dropinblog.net/34253310/files/featured/imagem-2024-09-26-103919931.png" alt="Fortnite 3">
                <div class="card-content">
                    <h3>Fortnite 3</h3>
                </div>
            </div>
        </div>

        <!-- Row 3: Minecraft -->
        <div class="row-title">Minecraft</div>
        <div class="grid">
            <div class="card">
                <img src="https://store-images.s-microsoft.com/image/apps.29741.13774133678237924.b2fb64a6-d8b2-4e05-a188-b727d48563ed.f5bc1582-f67e-4ef4-8d8a-7aac86b324f9?w=562" alt="Minecraft 1">
                <div class="card-content">
                    <h3>Minecraft 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://cdn.shopify.com/s/files/1/0759/8099/6937/files/minecraft-Paysage-montagnes_1024x1024.jpg?v=1771166065" alt="Minecraft 2">
                <div class="card-content">
                    <h3>Minecraft 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://assets.nintendo.com/image/upload/c_limit,f_auto,h_300,q_auto,w_500/v1/store/software/switch/70010000000964/Video/posters/a2761b7c2a1626561589be1efdebc15d8803ba2bf3fc570c81e50614ac2e5187" alt="Minecraft 3">
                <div class="card-content">
                    <h3>Minecraft 3</h3>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
