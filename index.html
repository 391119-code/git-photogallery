<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="icon" href="data:,">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="card">
                <img data-image-number="1" src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="School Building">
                <div class="card-content">
                    <h3>School</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="2" alt="Abstract gallery artwork 2">
                <div class="card-content">
                    <h3>Image Title 2</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="3" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Mountain Lake">
                <div class="card-content">
                    <h3>Image Title 3</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="4" src="https://www.goodhousekeeping.com/relationships/pets/g4531/cutest-dog-breeds/" alt="Cute Dog">
                <div class="card-content">
                    <h3>Cute Dog</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="5" alt="Abstract gallery artwork 5">
                <div class="card-content">
                    <h3>Image Title 5</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="6" alt="Abstract gallery artwork 6">
                <div class="card-content">
                    <h3>Image Title 6</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="7" alt="Abstract gallery artwork 7">
                <div class="card-content">
                    <h3>Image Title 7</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="8" alt="Abstract gallery artwork 8">
                <div class="card-content">
                    <h3>Image Title 8</h3>
                </div>
            </div>
            <div class="card">
                <img data-image-number="9" alt="Abstract gallery artwork 9">
                <div class="card-content">
                    <h3>Image Title 9</h3>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
