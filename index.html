<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .card-content h3 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+1" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 1</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+2" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 2</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+3" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 3</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+4" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 4</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+5" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 5</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+6" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 6</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+7" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 7</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+8" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 8</h3>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/400x200?text=Image+9" alt="Placeholder Image">
                <div class="card-content">
                    <h3>Image Title 9</h3>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
